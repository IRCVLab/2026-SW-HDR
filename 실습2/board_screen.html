<div id="ui">
 <b>촬영 전 체크리스트</b><br>
 ① 화면 <b>밝기 최대</b> · 자동 밝기 끄기<br>

 ③ 평면 모니터만 — <b>커브드 금지</b><br>
 ④ 줄무늬(플리커)가 찍히면 밝기를 한 단계 조정<br>
 <span class="dim">ChArUco 8×7 · DICT_5X5 — 실습 1과 동일 보드 · 픽셀 정수배 표시</span><br>
 <button id="fs">전체화면 (F)</button> <button id="hide" style="background:#5a6b7c">패널 숨기기 (H)</button>
</div>
<script>
const bd=document.getElementById('bd'), W=448, H=392;
function fit(){
  const k=Math.max(1, Math.floor(Math.min(innerWidth/W, innerHeight/H)));
  bd.style.width=(W*k)+'px'; bd.style.height=(H*k)+'px';
}
addEventListener('resize',fit); fit();
const fs=()=>document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
document.getElementById('fs').onclick=fs;
const ui=document.getElementById('ui');
document.getElementById('hide').onclick=()=>ui.style.display='none';
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='f')fs(); if(k==='h')ui.style.display=ui.style.display==='none'?'block':'none';});
</script></body></html>
